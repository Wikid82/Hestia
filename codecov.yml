# =============================================================================
# Codecov Configuration
# Require 85% coverage (project + patch) per the project's coverage mandate.
# Keep this ignore list in sync with vitest.config.ts's coverage.exclude.
# =============================================================================

coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        # New/changed code must hit 85% coverage — this is the merge-blocking
        # gate; see .claude/commands/fix-patch-coverage.md for closing gaps
        # before pushing.
        target: 85%
        threshold: 1%

require_ci_to_pass: yes

comment:
  require_changes: false
  require_base: false
  require_head: true
  layout: "reach, diff, flags, files"
  behavior: default

ignore:
  # Test files and harness
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "src/test/**"
  - "vitest.config.ts"
  - "playwright.config.ts"
  - "e2e/**"

  # Route entrypoints (Server Component pages/layouts): thin composition +
  # data-fetching wired straight into requireActiveUser() and the db —
  # exercised by Playwright e2e (e2e/household-flow.spec.ts) rather than
  # unit tests.
  - "src/app/**/page.tsx"
  - "src/app/**/layout.tsx"

  # Declarative schema (no branching logic) and process bootstrap.
  - "src/db/schema.ts"
  - "src/db/index.ts"
  - "src/instrumentation.ts"

  # Documentation, CI/CD & config
  - "docs/**"
  - "*.md"
  - ".github/**"
  - "scripts/**"
  - "*.yml"
  - "*.yaml"
  - "*.json"
  - "**/tailwind.config.*"
  - "**/postcss.config.*"
  - "**/eslint.config.*"
  - "**/tsconfig*.json"
  - "**/*.d.ts"

  # Build artifacts & dependencies
  - "node_modules/**"
  - ".next/**"
  - "coverage/**"
  - "playwright-report/**"
  - "test-results/**"
  - "data/**"
