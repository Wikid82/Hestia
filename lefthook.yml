# lefthook.yml — local git hooks, mirroring Charon's (see docs/current_spec.md
# for the research this was based on).
#
# INSTALL (one-time per clone): lefthook install
#
# pre-commit: fast, blocking, every commit.
# pre-push: build + test + build, blocking, every push — catches what CI
#   would catch, before burning a CI round-trip. Charon has no pre-push
#   hook at all; Hestia adds one deliberately.
#
# MANUAL PIPELINES (not run automatically — too slow to block every commit):
#   lefthook run security-full   (gitleaks + semgrep)
#   lefthook run codeql          (sequential: go → js → findings gate)
#   lefthook run testing         (coverage-gated tests + race detector)
#   lefthook run lint-full       (full golangci-lint, hadolint, markdownlint)
#
# TOOL REQUIREMENTS (must be installed locally; nothing manages them):
#   pre-commit:    shellcheck, actionlint, semgrep, python3 + PyYAML
#   security-full: gitleaks, semgrep, rsync
#   codeql:        codeql CLI, jq, yq
#   lint-full:     docker (hadolint image), markdownlint (markdownlint-cli)

# ============================================================
# PRE-COMMIT  (blocking, runs on every commit)
# ============================================================
pre-commit:
  parallel: true
  jobs:
    # --- File hygiene (replaces pre-commit/pre-commit-hooks) ---
    - name: end-of-file-fixer
      glob: "*.{go,ts,tsx,js,jsx,yaml,yml,sh,md}"
      exclude: "(^|/)(node_modules|coverage|dist|build|\\.vite|\\.docusaurus)/|.*\\.tsbuildinfo$"
      run: |
        modified=0
        for file in {staged_files}; do
          [ -f "$file" ] && [ -s "$file" ] && \
            [ -n "$(tail -c1 "$file")" ] && echo >> "$file" && modified=1
        done
        if [ "$modified" -eq 1 ]; then
          echo "end-of-file-fixer: files modified — review the changes, 'git add' what you want included, and commit again."
          exit 1
        fi

    - name: trailing-whitespace
      glob: "*.{go,ts,tsx,js,jsx,yaml,yml,sh,md}"
      exclude: "(^|/)(node_modules|coverage|dist|build|\\.vite|\\.docusaurus)/|.*\\.tsbuildinfo$"
      run: |
        modified=0
        for file in {staged_files}; do
          if grep -qP '\s+$' "$file" 2>/dev/null; then
            sed -i 's/[[:space:]]*$//' "$file" && modified=1
          fi
        done
        if [ "$modified" -eq 1 ]; then
          echo "trailing-whitespace: trailing spaces removed — review the changes, 'git add' what you want included, and commit again."
          exit 1
        fi

    - name: check-yaml
      glob: "*.{yaml,yml}"
      exclude: "(^|/)node_modules/"
      # Unknown tags (Compose's !reset / !override) are valid, so ignore them.
      run: |
        python3 -c "
        import sys, yaml
        class L(yaml.SafeLoader): pass
        L.add_multi_constructor('!', lambda loader, suffix, node: None)
        for f in sys.argv[1:]:
            list(yaml.load_all(open(f), Loader=L))
        " {staged_files}

    # --- Blocking commit guards (always run) ---
    - name: check-lfs-large-files
      run: bash scripts/pre-commit-hooks/check-lfs-for-large-files.sh

    - name: block-codeql-db
      run: bash scripts/pre-commit-hooks/block-codeql-db-commits.sh

    - name: block-data-backups
      run: bash scripts/pre-commit-hooks/block-data-backups-commit.sh

    # --- Shell / Actions ---
    - name: shellcheck
      glob: "*.sh"
      exclude: "(^|/)(node_modules|coverage|dist|build|test-results)/"
      run: shellcheck --severity=error {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yaml,yml}"
      run: actionlint {staged_files}

    # --- Go ---
    - name: go-vet
      glob: "backend/**/*.go"
      run: cd backend && go vet ./...

    - name: golangci-lint-fast
      glob: "backend/**/*.go"
      run: scripts/pre-commit-hooks/golangci-lint-fast.sh

    # --- Frontend ---
    - name: frontend-type-check
      glob: "frontend/**/*.{ts,tsx}"
      run: cd frontend && npx tsc -b --noEmit

    - name: frontend-lint
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: cd frontend && npm run lint

    # --- Security ---
    - name: semgrep
      glob: "{**/*.{go,ts,tsx,js,jsx,sh,yml,yaml,json},Dockerfile*}"
      exclude: "(^|/)(node_modules|coverage|dist|build|\\.vite|\\.docusaurus)/|package-lock\\.json$"
      run: scripts/pre-commit-hooks/semgrep-scan.sh {staged_files}

# ============================================================
# PRE-PUSH  (blocking, runs on every push)
# ============================================================
pre-push:
  jobs:
    - name: backend-build-and-test
      run: cd backend && go build ./... && go test ./...

    - name: frontend-build
      run: cd frontend && npm run build

# ============================================================
# MANUAL: security-full
# Run with: lefthook run security-full
# ============================================================
security-full:
  parallel: true
  jobs:
    - name: gitleaks
      run: scripts/pre-commit-hooks/gitleaks-tuned-scan.sh

    - name: semgrep
      run: scripts/pre-commit-hooks/semgrep-scan.sh

# ============================================================
# MANUAL: codeql
# Run with: lefthook run codeql
# MUST remain sequential — the findings gate reads the scans' SARIF output.
# ============================================================
codeql:
  parallel: false
  jobs:
    - name: 1-go-scan
      run: scripts/pre-commit-hooks/codeql-go-scan.sh

    - name: 2-js-scan
      run: scripts/pre-commit-hooks/codeql-js-scan.sh

    - name: 3-check-findings
      run: scripts/pre-commit-hooks/codeql-check-findings.sh

# ============================================================
# MANUAL: testing
# Run with: lefthook run testing
# ============================================================
testing:
  parallel: true
  jobs:
    - name: go-test-coverage
      run: scripts/go-test-coverage.sh

    - name: go-test-race
      run: cd backend && go test -race ./...

    - name: frontend-test-coverage
      run: scripts/frontend-test-coverage.sh

# ============================================================
# MANUAL: lint-full
# Run with: lefthook run lint-full
# ============================================================
lint-full:
  parallel: false
  jobs:
    - name: golangci-lint-full
      run: scripts/pre-commit-hooks/golangci-lint-full.sh

    - name: hadolint
      run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < Dockerfile

    - name: markdownlint
      run: |
        before=$(git diff -- '*.md' | md5sum)
        markdownlint --fix .; md_exit=$?
        if [ "$before" != "$(git diff -- '*.md' | md5sum)" ]; then
          echo "markdownlint: auto-fixed files — review the changes, 'git add' what you want included, and commit again."
          exit 1
        fi
        exit $md_exit
