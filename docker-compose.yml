services:
  hestia:
    build: .
    image: hestia:latest
    container_name: hestia
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/hestia.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — see .env.example}
      # Chore due-dates and "due today" are computed from the container's
      # local clock (Go's time.Local, backed by the tzdata package in the
      # image) — without this, everything runs on UTC regardless of where
      # the household actually is, and chores flip to the next day at UTC
      # midnight instead of local midnight.
      TZ: ${TZ:-UTC}
      # Outbound email is optional — see docs/environment.md. Left unset,
      # these all resolve to empty strings and the server runs with
      # email-dependent features (e.g. invites) unavailable.
      BASE_URL: ${BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # Closed by default — see docs/environment.md. Only the very first
      # signup on a fresh instance is ever allowed regardless of this
      # setting.
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
