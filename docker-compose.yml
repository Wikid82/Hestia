services:
  hestia:
    build: .
    image: hestia:latest
    container_name: hestia
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      DATABASE_PATH: /data/hestia.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — see .env.example}
