name: Feature request
description: Suggest a feature or improvement for Hestia
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does Hestia currently fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Mockups, examples from other apps, etc. are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this you've thought about?
    validations:
      required: false
  - type: checkboxes
    id: household-fit
    attributes:
      label: Household fit
      description: Hestia is built as a family chore chart, not a general task tracker — help us keep scope focused
      options:
        - label: This is useful for a household managing chores/points/rewards, not a software-team workflow feature
          required: true
