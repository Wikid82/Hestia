# CodeQL findings ignore-list.
#
# Policy (mirrors Charon's — see docs/current_spec.md): CodeQL findings of
# ANY severity block the CI CodeQL gate (.github/workflows/codeql.yml) by
# default. A finding is only allowed to pass if it has a matching,
# non-expired entry here.
#
# Matching: an entry suppresses a SARIF result iff
#   result.ruleId == rule_id
#   AND result.locations[0].physicalLocation.artifactLocation.uri == path
#   AND result.locations[0].physicalLocation.region.startLine is within
#       [line] or [line_range.start, line_range.end]
#
# Expiry: entries past review_by are treated as EXPIRED and stop
# suppressing (the finding reverts to blocking, printed distinctly from a
# brand-new/never-triaged finding so it's obvious a renewal decision is
# needed). Bump review_by (with a dated note in the reason) or fix the
# underlying issue.
#
# Enforced by scripts/security/codeql-findings-gate.sh, which both CI
# (.github/workflows/codeql.yml) and a local scan would use — see that
# script's header for the exact matching/expiry logic.
suppressions:
  - rule_id: go/email-injection
    path: backend/internal/services/mailer.go
    line: 72
    reason: >
      False positive: this query (codeql/go-queries EmailInjectionCustomizations.qll,
      v1.6.8, matching what CI's codeql-action pulls) has no sanitizer/barrier model
      at all — confirmed by reading the query pack source and reproducing locally
      with a database built from this exact code. It's pure Source -> Sink taint
      reachability (Flow::flowPath), so it flags ANY HTTP-derived value reaching
      Mailer.Send regardless of validation; no in-code fix can ever satisfy it for
      a real invite-email feature. The actual vulnerability this query targets
      (CRLF header injection) is closed: Send rejects `to`/`subject` outright if
      they contain a line break, verified by TestMailer_RejectsRecipientWithEmbeddedCRLF
      and TestMailer_RejectsSubjectWithHeaderInjection in mailer_test.go. An
      in-source `codeql[go/email-injection]` suppression comment is present at this
      line too (correctly placed per GitHub's documented syntax) but is not honored
      by the Go extractor for this call shape — confirmed via a fresh SARIF scan
      showing no `suppressions` key on the result, and via the live GitHub alert
      (#361) still showing `state: open` after the commit containing the comment.
      This entry is the documented fallback for that case, mirroring Charon's own
      precedent for the same failure mode (see Charon's
      docs/issues/codeql-cookie-suppression-not-honored.md).
    added: "2026-08-19"
    review_by: "2026-11-19"

  - rule_id: go/email-injection
    path: backend/internal/services/mailer.go
    line: 101
    reason: >
      Same root cause and mitigation as the line-72 entry above (this is the
      TLS-path sink, `w.Write(msg)`, mirroring the plaintext-path sink at
      `smtp.SendMail(...)`) — see that entry for the full explanation. Live
      GitHub alert #362.
    added: "2026-08-19"
    review_by: "2026-11-19"

  # Example entry (uncomment/copy when a new exception is needed):
  # - rule_id: go/example-rule-id
  #   path: backend/internal/example.go
  #   line: 1
  #   reason: >
  #     Why this finding is a false positive or an accepted, justified risk.
  #   added: "2026-08-19"
  #   review_by: "2026-11-19"
