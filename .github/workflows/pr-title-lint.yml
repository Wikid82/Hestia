name: PR title lint

# release-please derives versions and changelog entries from conventional
# commit prefixes (feat:, fix:, chore:, etc). When a PR is squash-merged,
# the PR title becomes the commit message, so the title has to follow the
# same convention or the release automation silently misses it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
