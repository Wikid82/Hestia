name: Docker Build & Publish

# All events build + push to both registries (Docker Hub + GHCR):
# - Pull requests: tagged pr-<number>
# - Push to main: tagged latest (+ short sha for traceability)
# - Push to development/nightly/feature/**: tagged with the (sanitized)
#   branch name, e.g. development, nightly, feature-foo
# - Release published: tagged with the released semver (and latest, since a
#   fresh release should be latest)
#
# Every build is scanned for image vulnerabilities (Trivy) and supply-chain
# risk (Syft SBOM + Grype), uploaded to the Security tab as SARIF. Neither
# blocks the build right now — this is meant for visibility (know where and
# when to patch) rather than enforcement; revisit once there's a branch
# strategy to gate against. Known findings with no fix yet are suppressed
# via .trivyignore / .grype.yaml — see SECURITY.md for why, and the review
# date each suppression expires.

on:
  pull_request:
  push:
    branches: [main, development, nightly, 'feature/**']
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Skip PR-triggered builds for our own propagate/promotion PRs
    # (opened by github-actions[bot] — see propagate-main-to-development.yml
    # and promote-nightly-to-main.yml). Their head is always an existing
    # branch (main or nightly) that already got a push-triggered build for
    # this exact commit — a second concurrent multi-arch build of identical
    # content is pure waste, and running two QEMU-emulated arm64 builds at
    # once is the most likely reason one of them hung for 2+ hours on
    # 2026-08-09 instead of failing cleanly.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Hard ceiling regardless of cause — a hang shouldn't be able to run for
    # hours. Sized for 2 retry attempts (below) plus the scan chain after.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout (release)
        if: github.event_name == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout
        if: github.event_name != 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            wikid82/hestia
            ghcr.io/wikid82/hestia
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Determine build platforms
        id: platforms
        run: |
          # PR builds are for validation, not the published artifact — skip
          # QEMU-emulated arm64 there entirely. It's slow and, per the
          # 2026-08-09 incident, the most likely source of an outright hang
          # during native module (better-sqlite3) cross-compilation. Real
          # multi-arch images (what self-hosters actually pull) still come
          # from push-to-main/development/nightly and releases.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
          tool-cache: false

      # docker/build-push-action itself has no retry support, so a build
      # step wrapped in nick-fields/retry has to invoke buildx directly
      # rather than as a `uses:` step. timeout_minutes bounds each attempt
      # individually (separate from the job-level timeout-minutes above,
      # which bounds the whole job regardless of how many attempts run).
      - name: Build and push (with retry)
        id: build
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 15
          warning_on_retry: true
          command: |
            set -euo pipefail

            TAG_ARGS=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && TAG_ARGS+=(--tag "$tag")
            done <<< "${{ steps.meta.outputs.tags }}"

            LABEL_ARGS=()
            while IFS= read -r label; do
              [[ -n "$label" ]] && LABEL_ARGS+=(--label "$label")
            done <<< "${{ steps.meta.outputs.labels }}"

            docker buildx build \
              --platform "${{ steps.platforms.outputs.platforms }}" \
              --push \
              "${TAG_ARGS[@]}" \
              "${LABEL_ARGS[@]}" \
              --iidfile /tmp/image-digest.txt \
              .

            echo "digest=$(cat /tmp/image-digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan (table)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/wikid82/hestia@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (SARIF)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/wikid82/hestia@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Upload Trivy results to Security tab
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Generate SBOM
        if: always() && steps.build.outcome == 'success'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/wikid82/hestia@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Scan SBOM for vulnerabilities (Grype)
        if: always() && steps.build.outcome == 'success'
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: sbom.cyclonedx.json
          output-format: sarif
          severity-cutoff: high
          fail-build: false

      - name: Upload Grype results to Security tab
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: supply-chain-sbom

      - name: Upload SBOM artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30
