name: Docker Build & Publish

# All events build + push to both registries (Docker Hub + GHCR):
# - Pull requests: validated with a native amd64 build only (--load, no
#   push) — PRs aren't a published artifact.
# - Push to main: tagged latest (+ short sha for traceability)
# - Push to development/nightly/feature/**: tagged with the (sanitized)
#   branch name, e.g. development, nightly, feature-foo
# - Release published: tagged with the released semver (and latest, since a
#   fresh release should be latest)
#
# Multi-arch publishing builds each platform on its own NATIVE runner
# (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) rather than
# cross-building arm64 under QEMU emulation on an amd64 runner. On
# 2026-08-09 a QEMU-emulated `npm ci --legacy-peer-deps` reliably crashed with "qemu: uncaught
# target signal 4 (Illegal instruction) - core dumped" while running one of
# esbuild's postinstall steps — deterministic on every retry, not a
# transient hang. GitHub's Linux arm64 hosted runners are free for public
# repos and sidestep emulation entirely for the actual build; QEMU is no
# longer used anywhere in this workflow. Each arch pushes its image by
# digest, then a merge job combines the digests into one multi-arch
# manifest per tag and pushes that to both registries.
#
# Every published build is scanned for image vulnerabilities (Trivy) and
# supply-chain risk (Syft SBOM + Grype), uploaded to the Security tab as
# SARIF. Neither blocks the build right now — this is meant for visibility
# (know where and when to patch) rather than enforcement; revisit once
# there's a branch strategy to gate against. Known findings with no fix yet
# are suppressed via .trivyignore / .grype.yaml — see SECURITY.md for why,
# and the review date each suppression expires.

on:
  pull_request:
  push:
    branches: [main, development, nightly, 'feature/**']
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/wikid82/hestia

jobs:
  # PR builds validate the Dockerfile builds cleanly on native amd64 — no
  # push, no arm64 leg (self-hosters pull from the push/release builds
  # below, not from a PR).
  build-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
          tool-cache: false

      - name: Build (validate only)
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hestia:pr-${{ github.event.pull_request.number }}

      - name: Trivy vulnerability scan (table)
        uses: step-security/trivy-action@4d04e2d32ba36aae5693467644b22741d68f9115 # v0.36.0
        with:
          image-ref: hestia:pr-${{ github.event.pull_request.number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

  # Push/release builds: one native runner per architecture, each pushing
  # its single-platform image by digest. See header comment for why this
  # replaced a single cross-platform QEMU build.
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout (release)
        if: github.event_name == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout
        if: github.event_name != 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Log in to GHCR
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 2
          retry_wait_seconds: 10
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
          tool-cache: false

      - name: Build and push by digest
        id: build
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # provenance: false — otherwise buildx wraps even a single-platform
          # push in a 2-entry OCI index (image manifest + attestation
          # manifest), so the exported digest points at an index rather than
          # the plain image manifest. That breaks anything resolving the
          # digest directly (confirmed: Trivy's remote fetcher errors with
          # "no child with platform linux/amd64 in index ..." trying to scan
          # it) and serves no purpose here since digest-merge already
          # produces one clean multi-arch manifest in the step below.
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform for artifact name
        id: platform-slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ steps.platform-slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into one multi-arch manifest per
  # tag, pushed to both registries, then scan the result.
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout (release)
        if: github.event_name == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout
        if: github.event_name != 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Log in to GHCR
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 2
          retry_wait_seconds: 10
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Log in to Docker Hub
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 2
          retry_wait_seconds: 10
          command: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Docker metadata
        id: meta
        uses: step-security/metadata-action@21378f5b76c96c69ac34d21cc3873d85e26381b1 # v6.2.0
        with:
          images: |
            wikid82/hestia
            ghcr.io/wikid82/hestia
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t image_refs < <(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s\n' *)
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Determine digest for scanning
        id: scan
        run: |
          # Either single-platform digest is representative for scanning —
          # OS package and npm dependency findings don't differ by arch.
          echo "digest=sha256:$(find /tmp/digests -type f -printf '%f\n' | sort | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan (table)
        uses: step-security/trivy-action@4d04e2d32ba36aae5693467644b22741d68f9115 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.scan.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (SARIF)
        uses: step-security/trivy-action@4d04e2d32ba36aae5693467644b22741d68f9115 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.scan.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # anchore/sbom-action uploads the SBOM it generates as a workflow
      # artifact itself (and attaches it to the GitHub Release on release
      # events), so there is no separate upload-artifact step. Grype below
      # scans the pushed image directly rather than consuming this SBOM
      # file: sbom-action's `output-file` input only reliably writes to a
      # temp dir (v0.24.1 stopped writing it into the workspace at all),
      # and chaining the two tools through an on-disk file that a patch
      # bump can silently relocate is exactly what broke this job. Both
      # scanners now take the image digest independently, like the Trivy
      # steps above.
      - name: Generate SBOM
        uses: step-security/sbom-action@28bb7d0d2869c9ab0e5571c93591747945819d39 # v0.24.2
        with:
          image: ${{ env.REGISTRY_IMAGE }}@${{ steps.scan.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ github.sha }}.cyclonedx.json

      - name: Scan image for vulnerabilities (Grype)
        id: grype
        uses: step-security/anchore-scan-action@a09aeacdedd17f1a8e912b3519ee9d7ea124498a # v7.4.2
        with:
          image: ${{ env.REGISTRY_IMAGE }}@${{ steps.scan.outputs.digest }}
          output-format: sarif
          severity-cutoff: high
          fail-build: false

      - name: Upload Grype results to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: supply-chain-sbom
