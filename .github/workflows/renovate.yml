name: Renovate

on:
  schedule:
    # Off the top of the hour on purpose — GitHub explicitly documents that
    # exact-hour crons are the most likely to be delayed or dropped under
    # scheduler load.
    - cron: '17 5 * * *' # daily ~05:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Renovate authenticates via the RENOVATE_TOKEN PAT; GITHUB_TOKEN is only used by checkout.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
