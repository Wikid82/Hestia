name: Renovate

on:
  schedule:
    - cron: '0 5 * * *' # daily 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Renovate authenticates via the RENOVATE_TOKEN PAT; GITHUB_TOKEN is only
# used by checkout. A PAT is required (rather than the default GITHUB_TOKEN)
# because PRs opened with the default token can't trigger other workflows
# like CI, which would leave every Renovate PR stuck showing no check runs.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.1
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
