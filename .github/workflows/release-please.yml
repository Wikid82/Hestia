name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: step-security/release-please-action@26a11e1978efcda4d5c2834bd4c39a74a717cab6 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
