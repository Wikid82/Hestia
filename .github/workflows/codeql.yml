name: CodeQL

on:
  push:
    branches: [main, development, nightly, 'feature/**']
  pull_request:
    branches: [main, development, nightly]
  schedule:
    - cron: '30 3 * * 1' # Mondays ~03:30 UTC, off the top of the hour
  workflow_dispatch:

concurrency:
  # PRs: cancel the scan for superseded commits on the same PR (the old
  # code no longer matters). Pushes: key on the commit SHA, not the branch
  # name — otherwise a second push to the same branch before CodeQL
  # finishes cancels the first commit's scan and leaves it with a
  # permanently cancelled/red check instead of a result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
