# Grype vulnerability suppression configuration.
# Auto-detected by anchore/scan-action (and plain `grype` CLI runs) when
# present at the repo root — no extra config wiring needed in CI.
# Every entry here must have a matching write-up in SECURITY.md and a
# matching ID in .trivyignore.
# Docs: https://github.com/anchore/grype#specifying-matches-to-ignore
#
# History: switched the base image from node:24.19.0-slim (Debian) to
# node:24.19.0-alpine on 2026-08-09 after a side-by-side scan showed 152
# Trivy findings on slim vs 11 on alpine (0 HIGH/CRITICAL either way), and
# stripped the bundled npm CLI from the runtime image (fixed the remaining
# fixable ones — npm's own tar/undici/ip-address, never invoked at
# runtime). The Debian-specific entries this file used to carry no longer
# apply on Alpine and were removed rather than left stale.

ignore:
  - vulnerability: CVE-2025-60876
    reason: |
      MEDIUM (CVSS 6.5) — BusyBox wget HTTP request-splitting via CRLF
      injection in the request-target. Affects busybox, busybox-binsh, and
      ssl_client (all built from the same busybox source package on
      Alpine). No fix version published as of 2026-08-09. Hestia never
      invokes wget or any busybox applet — the container's only process is
      `node server.js`.
    expiry: "2026-09-20"
  - vulnerability: GO-2026-5932
    reason: |
      UNKNOWN severity — golang.org/x/crypto/openpgp is unsafe by design
      and unmaintained upstream. This is a whole-module match (grype's own
      matchDetails show go-module-matcher / versionConstraint "none
      (unknown)"), not a reachability finding, and fix.versions is empty
      upstream since the advisory's point is "don't call this subpackage,"
      not "upgrade past it." `go mod why golang.org/x/crypto/openpgp`
      confirms the main module does not need that package; `go list -deps
      ./...` shows only bcrypt/chacha20poly1305/sha3 pulled in via
      golang-jwt/jwt and our own bcrypt-based password hashing. Hestia has
      no PGP/OpenPGP feature and never imports openpgp.
    expiry: "2026-11-17"
  - vulnerability: CVE-2026-85091
    reason: |
      HIGH severity — zlib finding on the Alpine 3.24 branch (package zlib
      1.3.2-r0). No fixed -rN build published upstream as of 2026-09-27.
      The Dockerfile now pins zlib explicitly (ZLIB_VERSION, tracked by
      Renovate via the repology datasource against alpine_3_24/zlib) so a
      Renovate PR opens the moment a fix ships, rather than relying on
      `apk upgrade` to silently pick it up on some future rebuild.
    expiry: "2026-10-18"
