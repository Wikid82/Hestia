# Playwright e2e override — layer on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
#
# Deliberately diverges from production defaults (docs/current_spec.md
# Decision 8/9): ALLOW_PUBLIC_SIGNUP=true so every spec after global-setup's
# first signup can still create its own isolated household, and outbound
# email points at Mailpit (a disposable SMTP catcher) instead of a real
# provider so the invite-accept flow can be driven through a real email
# end to end. This is a throwaway container for CI/local e2e runs, not a
# real deployment — never reuse these values outside e2e.
# E2E_HOST_PORT (default 8080) controls the host-side port mapping — override
# it locally (e.g. E2E_HOST_PORT=18080) if something else on your machine
# already holds 8080, including a real Hestia instance you're running
# separately from this checkout. CI runners are clean, so the default is
# fine there and PLAYWRIGHT_BASE_URL doesn't need to be set in e2e.yml.
#
# `name:` below pins this stack's Compose PROJECT to "hestia-e2e",
# distinct from the default project name Compose would otherwise derive
# from the checkout's directory name ("hestia"). This isn't cosmetic —
# it's a real safety fix for an incident that happened twice: Compose
# tracks "is this an existing container to reconfigure, or a new one" by
# (project, service-name) — NOT by container_name, and NOT by which -f
# files a given invocation happens to pass. A self-hoster (or a future
# session) running a real, separately-deployed instance from this same
# checkout via plain `docker compose up -d` (auto-merging a local
# docker-compose.override.yml) uses the same default project ("hestia")
# and the same service key ("hestia") as this e2e stack — so even though
# this file sets its own container_name (hestia-e2e), Compose still saw
# them as the same logical (project, service) and reconfigured the real
# container onto the e2e port/volume in place. See docs/current_spec.md's
# PR3 retrospective for the incident writeup. `name:` is the documented,
# declarative way to pin a project name in the compose file itself
# (Compose Spec's top-level `name:` key) so this can never collide again,
# regardless of how either stack is invoked.
name: hestia-e2e
services:
  hestia:
    container_name: hestia-e2e
    ports: !override
      - "${E2E_HOST_PORT:-8080}:8080"
    environment:
      AUTH_SECRET: e2e-test-secret-not-for-production-use
      BASE_URL: http://127.0.0.1:${E2E_HOST_PORT:-8080}
      SMTP_SERVER: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: hestia@e2e.test
      SMTP_USE_TLS: "false"
      ALLOW_PUBLIC_SIGNUP: "true"
      # COOKIE_SECURE defaults to false (see docker-compose.yml/issue #79),
      # which is exactly what this plain-HTTP e2e stack needs — no
      # GIN_MODE override required here anymore.
    # Scratch data only — never the real ./data bind mount from
    # docker-compose.yml. A named volume gets removed by `docker compose
    # down -v` between runs so every e2e run starts from a clean database.
    volumes: !override
      - hestia-e2e-data:/data
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: hestia-e2e-mailpit
    restart: "no"
    ports:
      - "8025:8025"

volumes:
  hestia-e2e-data:
